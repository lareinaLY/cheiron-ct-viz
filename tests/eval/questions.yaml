# Planner eval set (not run by pytest). Run: uv run python scripts/eval_planner.py
#
# Each case gives the question and the expected plan fields:
# - outcome: plan | unsupported | clarification
# - cohorts: every cohort's filters, in any order. Filters not listed must be absent
#   (an invented filter is a miss). Strings compare case-insensitively.
# - dimension or relation; top_n and bottom_n (absent means null; a ranking question
#   without a number expects the configured default, DEFAULT_TOP_N_FOR_RANKING, as top_n
#   for "most" and as bottom_n for "fewest").
# - ranking_direction (optional): the draft's most | fewest | null; scored only for
#   cases that list it.
# Granularity is scored for temporal dimensions (start_year vs start_month).
# - unhandled_terms (optional): the exact set of question parts the plan cannot apply,
#   compared casefolded; scored only for cases that list it.
# A case with several acceptable answers gives `expect_any` (a list of expectations)
# instead of `expect`; it passes when any one matches, and the report names which.
# - note (optional): why the expectation is what it is; copied into the report.
# Names and wording differ from the few-shot examples in planner/prompt.py.

- id: trend_drug_year_range
  class: trend
  question: How many nivolumab trials started each year between 2016 and 2022?
  expect:
    outcome: plan
    cohorts:
      - {drug: nivolumab, start_year_from: 2016, start_year_to: 2022}
    dimension: start_year

- id: trend_drug_monthly
  class: trend
  question: Monthly number of new semaglutide trials since 2024
  expect:
    outcome: plan
    cohorts:
      - {drug: semaglutide, start_year_from: 2024}
    dimension: start_month

- id: trend_condition_over_time
  class: trend
  question: How has the number of Alzheimer's trials changed over time?
  expect:
    outcome: plan
    cohorts:
      - {condition: Alzheimer's}
    dimension: start_year

- id: distribution_brand_name_phase
  class: distribution
  question: What is the phase distribution of trials for Ozempic?
  expect:
    outcome: plan
    cohorts:
      - {drug: Ozempic}
    dimension: phase

- id: distribution_sponsor_class
  class: distribution
  question: Break down recruiting multiple myeloma trials by sponsor type
  expect:
    outcome: plan
    cohorts:
      - {condition: multiple myeloma, statuses: [RECRUITING]}
    dimension: sponsor_class

- id: distribution_enrollment
  class: distribution
  question: What are the enrollment sizes of phase 2 glioblastoma trials?
  expect:
    outcome: plan
    cohorts:
      - {condition: glioblastoma, phases: [PHASE2]}
    dimension: enrollment_bucket

- id: comparison_two_drugs_phase
  class: comparison
  question: Compare trial phases for adalimumab versus infliximab
  expect:
    outcome: plan
    cohorts:
      - {drug: adalimumab}
      - {drug: infliximab}
    dimension: phase

- id: comparison_statuses_abbreviation
  class: comparison
  question: Recruiting vs completed NSCLC trials by phase
  expect:
    outcome: plan
    cohorts:
      - {condition: NSCLC, statuses: [RECRUITING]}
      - {condition: NSCLC, statuses: [COMPLETED]}
    dimension: phase

- id: comparison_start_years_shared_filter
  class: comparison
  question: How do yearly trial starts compare for trastuzumab and pertuzumab since 2018?
  expect:
    outcome: plan
    cohorts:
      - {drug: trastuzumab, start_year_from: 2018}
      - {drug: pertuzumab, start_year_from: 2018}
    dimension: start_year

- id: geographic_top_n_phase
  class: geographic
  question: Top 5 countries for phase 3 rheumatoid arthritis trials
  expect:
    outcome: plan
    cohorts:
      - {condition: rheumatoid arthritis, phases: [PHASE3]}
    dimension: country
    top_n: 5

- id: geographic_sponsor_recruiting
  class: geographic
  question: Where are Pfizer's recruiting trials located?
  expect:
    outcome: plan
    cohorts:
      - {sponsor: Pfizer, statuses: [RECRUITING]}
    dimension: country

- id: geographic_ranking_without_number
  class: geographic
  question: Which countries have the most recruiting trials for non-small cell lung cancer?
  expect:
    outcome: plan
    cohorts:
      - {condition: non-small cell lung cancer, statuses: [RECRUITING]}
    dimension: country
    # No number in the question: the LLM sets ranking_direction "most" and code sets the
    # configured DEFAULT_TOP_N_FOR_RANKING (15).
    top_n: 15

- id: network_sponsor_drug
  class: network
  question: Which sponsors run tirzepatide trials, and which other drugs do they test?
  expect:
    outcome: plan
    cohorts:
      - {drug: tirzepatide}
    relation: sponsor_drug

- id: network_condition_drug
  class: network
  question: Show the network of conditions and drugs in sickle cell disease trials
  expect:
    outcome: plan
    cohorts:
      - {condition: sickle cell disease}
    relation: condition_drug

- id: unsupported_adverse_events
  class: unsupported
  question: What were the most common adverse events in pembrolizumab trials?
  expect:
    outcome: unsupported

- id: ambiguous_two_groupings
  class: ambiguous
  question: Break down Opdivo trials by sponsor and by year
  expect:
    outcome: clarification

- id: unhandled_combination_trend
  class: unhandled
  question: How many new durvalumab combination trials started each year since 2019?
  expect:
    outcome: plan
    cohorts:
      # start_year_to must stay null: "since 2019" states no end year.
      - {drug: durvalumab, start_year_from: 2019, start_year_to: null}
    dimension: start_year
    unhandled_terms: [combination]

- id: unhandled_line_and_monotherapy
  class: unhandled
  question: Phase breakdown of second-line lorlatinib monotherapy trials
  expect:
    outcome: plan
    cohorts:
      - {drug: lorlatinib}
    dimension: phase
    unhandled_terms: [second-line, monotherapy]

- id: misspelled_drug_phase
  class: robustness
  question: pembrolizumb by phase
  expect:
    outcome: plan
    cohorts:
      # Rule 1: names are copied verbatim, misspellings included; the planner never
      # corrects a name it would have to guess.
      - {drug: pembrolizumb}
    dimension: phase

- id: colloquial_abbreviation_comparison
  class: robustness
  question: pembro vs nivo phases
  note: >-
    Verbatim names are the designed behaviour: rule 1 exists so the LLM never
    substitutes a name it guessed, so a plan with drug=pembro and drug=nivo by phase is
    the correct planner output. Listing them in unhandled_terms would be wrong, because
    they are applied as filters. The user-facing gap ("pembro" matches almost nothing)
    belongs to a zero-match "did you mean" step at retrieval time (README section 9),
    not to the planner.
  expect:
    outcome: plan
    cohorts:
      - {drug: pembro}
      - {drug: nivo}
    dimension: phase

- id: condition_abbreviation
  class: robustness
  question: How many NSCLC trials started each year?
  expect:
    outcome: plan
    cohorts:
      - {condition: NSCLC}
    dimension: start_year

- id: multi_intent
  class: ambiguous
  question: Show atezolizumab trials by phase and also which countries run them
  expect:
    outcome: clarification

- id: chinese_question
  class: robustness
  question: 帕博利珠单抗每年的试验数量
  note: >-
    "Pembrolizumab trials per year" in Chinese. Rule 1 forbids translating a name, so a
    plan is only useful if the model maps the Chinese name to the registry name;
    declining or asking back is also acceptable. A plan that copies the Chinese name
    verbatim is a miss: it would match no registry record.
  expect_any:
    - outcome: plan
      cohorts:
        - {drug: pembrolizumab}
      dimension: start_year
    - outcome: unsupported
    - outcome: clarification

- id: fewest_is_not_ranking
  class: geographic
  question: Which countries have the fewest recruiting melanoma trials?
  note: >-
    The id predates the fix and is kept because the cached paraphrases are keyed by it.
    Until 2026-10-18 the expectation was "no ranking" (top_n null), because the boolean
    ranking_intent could only mean "most" and gpt-5-mini set it for "fewest", showing
    the 15 largest countries. "fewest" is now its own direction, trimmed to the bottom N.
  expect:
    outcome: plan
    cohorts:
      - {condition: melanoma, statuses: [RECRUITING]}
    dimension: country
    ranking_direction: fewest
    top_n: null
    bottom_n: 15

- id: since_year_open_end
  class: trend
  question: Number of osimertinib trials per year since 2015
  expect:
    outcome: plan
    cohorts:
      - {drug: osimertinib, start_year_from: 2015, start_year_to: null}
    dimension: start_year

- id: scope_interventional_exclude_withdrawn
  class: distribution
  question: Phase breakdown of interventional pembrolizumab trials, excluding withdrawn ones
  note: >-
    Study-scope filters (domain review #3) are set only from explicit wording; every other
    case expects them absent ("trials" alone is not a study type).
  expect:
    outcome: plan
    cohorts:
      - {drug: pembrolizumab, study_types: [INTERVENTIONAL], exclude_withdrawn: true}
    dimension: phase

- id: scope_treatment_purpose
  class: trend
  question: How many treatment studies of nivolumab started each year since 2018?
  expect:
    outcome: plan
    cohorts:
      - {drug: nivolumab, primary_purposes: [TREATMENT], start_year_from: 2018}
    dimension: start_year

- id: scope_observational
  class: geographic
  question: In which countries are observational semaglutide studies run?
  expect:
    outcome: plan
    cohorts:
      - {drug: semaglutide, study_types: [OBSERVATIONAL]}
    dimension: country
